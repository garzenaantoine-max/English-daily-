<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>English Daily</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#151923;--muted:#737a89;--accent:#4f63ff;--soft:#eef0ff;--border:#e8eaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button{font:inherit;border:0;cursor:pointer}
.app{width:min(100%,520px);margin:auto;min-height:100vh;padding:18px 16px 100px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 20px}
.title{font-size:27px;font-weight:800;letter-spacing:-.7px}.subtitle{color:var(--muted);font-size:14px;margin-top:3px}
.streak{background:#fff;border:1px solid var(--border);padding:9px 12px;border-radius:14px;font-size:14px;font-weight:750}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#eceef4;padding:4px;border-radius:15px;margin-bottom:15px}
.nav button{background:transparent;color:#6c7280;padding:10px 4px;border-radius:11px;font-size:14px;font-weight:700}
.nav button.active{background:#fff;color:var(--text);box-shadow:0 2px 8px #0000000c}
.panel{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 8px 30px #20263d0a}
.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:650}
.progress{height:7px;background:#eceef3;border-radius:99px;overflow:hidden;margin:10px 0 5px}.fill{height:100%;background:var(--accent);border-radius:99px;transition:.25s}
.cardword{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tag{font-size:12px;font-weight:800;color:var(--accent);background:var(--soft);padding:6px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
.word{font-size:38px;font-weight:850;letter-spacing:-1px;margin:18px 0 8px;word-break:break-word}
.translation{font-size:22px;font-weight:750;min-height:30px}.example{color:var(--muted);font-size:15px;line-height:1.45;margin:12px 8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:15px 12px;border-radius:15px;font-weight:750}.secondary{background:#eef0f5;color:#272d3b}.primary{background:var(--accent);color:#fff}
.full{grid-column:1/-1}
.quiztitle{text-align:center;font-size:16px;color:var(--muted);margin:4px 0}
.quizword{text-align:center;font-size:34px;font-weight:850;margin:20px 0}
.choices{display:grid;gap:9px}.choice{background:#f1f3f7;text-align:left;padding:15px;border-radius:14px;font-weight:650}.choice:active{transform:scale(.99)}
.score{text-align:center;font-weight:800;margin:15px 0 0}
.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#f7f8fb;border:1px solid #eceef3;padding:12px 13px;border-radius:14px}.en{font-weight:800}.fr{color:#5e6573;text-align:right;font-size:14px}
.hidden{display:none!important}
.bottomhint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.word{font-size:33px}.cardword{min-height:270px}}
</style>
</head>
<body>
<div class="app">
<header>
<div><div class="title">English Daily 🇬🇧</div><div class="subtitle">Ta routine d’anglais</div></div>
<div class="streak">🔥 <span id="streak">0</span> jour</div>
</header>

<div class="nav">
<button id="tabCards" class="active" onclick="mode('cards')">Réviser</button>
<button id="tabQuiz" onclick="mode('quiz')">Quiz</button>
<button id="tabList" onclick="mode('list')">Mots</button>
</div>

<section id="cards" class="panel">
<div class="progressrow"><span id="counter"></span><span id="day"></span></div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div class="cardword">
<div class="tag" id="tag"></div>
<div class="word" id="word"></div>
<div class="translation" id="translation">Appuie pour révéler</div>
<div class="example" id="example"></div>
</div>
<div class="actions">
<button class="btn secondary" onclick="reveal()">Révéler</button>
<button class="btn primary" onclick="next()">Suivant →</button>
</div>
<div class="bottomhint">Astuce : essaie de traduire le mot avant de révéler.</div>
</section>

<section id="quiz" class="panel hidden">
<div class="quiztitle">Choisis la bonne traduction</div>
<div class="quizword" id="qword"></div>
<div class="choices" id="choices"></div>
<div class="score" id="score"></div>
</section>

<section id="list" class="panel hidden">
<h2 style="margin-top:0">📚 Ton vocabulaire</h2>
<div class="list" id="wordlist"></div>
</section>
</div>

<script>
const words=[
["to achieve","accomplir / atteindre","I want to achieve my goals.",1],
["effort","effort","Success requires effort.",1],
["reliable","fiable","He is a reliable person.",1],
["to improve","améliorer / progresser","I want to improve my English.",1],
["although","bien que / même si","Although it was difficult, I continued.",1],
["eventually","finalement / à terme","Eventually, you will succeed.",1],
["to struggle","avoir du mal à","I struggle to wake up early.",1],
["aware","conscient de","I am aware of the problem.",1],
["purpose","but / objectif","What is the purpose of this?",1],
["to overcome","surmonter","You can overcome difficulties.",1],
["to require","nécessiter / exiger","This requires patience.",2],
["despite","malgré","Despite the difficulties, he continued.",2],
["to afford","pouvoir se permettre","I can't afford it.",2],
["issue","problème / question","We need to solve this issue.",2],
["to figure out","comprendre / trouver la solution","I'll figure it out.",2],
["likely","probable","It is likely to happen.",2],
["to avoid","éviter","Try to avoid distractions.",2],
["improvement","amélioration / progrès","I've seen a big improvement.",2],
["to deserve","mériter","You deserve a break.",2],
["to handle","gérer / faire face à","She knows how to handle difficult situations.",2]
];
let i=0,revealed=false,q=0,score=0;
const $=x=>document.getElementById(x);
function render(){
 let w=words[i]; $("counter").textContent=`${i+1} / ${words.length}`;$("day").textContent=`Jour ${w[3]}`;
 $("fill").style.width=((i+1)/words.length*100)+"%";$("word").textContent=w[0];
 $("tag").textContent=w[0].startsWith("to ")?"VERBE":"VOCABULAIRE";
 $("translation").textContent=revealed?w[1]:"Appuie pour révéler";
 $("example").textContent=revealed?"“"+w[2]+"”":"";
}
function reveal(){revealed=true;render()}
function next(){i=(i+1)%words.length;revealed=false;render()}
function mode(x){
 ["cards","quiz","list"].forEach(a=>$(a).classList.toggle("hidden",a!==x));
 ["tabCards","tabQuiz","tabList"].forEach(a=>$(a).classList.remove("active"));
 $("tab"+x[0].toUpperCase()+x.slice(1)).classList.add("active");
 if(x==="quiz")newQuiz(); if(x==="list")list();
}
function newQuiz(){q=0;score=0;quizQuestion()}
function quizQuestion(){
 if(q>=10){$("qword").textContent="🎉 Quiz terminé";$("choices").innerHTML="";$("score").textContent=`Score : ${score} / 10`;return}
 let n=Math.floor(Math.random()*words.length),correct=words[n][1],a=[correct];
 while(a.length<4){let x=words[Math.floor(Math.random()*words.length)][1];if(!a.includes(x))a.push(x)}
 a.sort(()=>Math.random()-.5);$("qword").textContent=words[n][0];$("choices").innerHTML="";
 a.forEach(x=>{let b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>{if(x===correct)score++;q++;quizQuestion()};$("choices").appendChild(b)});
 $("score").textContent=`Question ${q+1} / 10 • ${score} bonne${score>1?"s":""} réponse${score>1?"s":""}`;
}
function list(){$("wordlist").innerHTML=words.map(w=>`<div class="item"><div><div class="en">${w[0]}</div><div class="small">Jour ${w[3]}</div></div><div class="fr">${w[1]}</div></div>`).join("")}
render();list();
</script>
</body>
</html>
